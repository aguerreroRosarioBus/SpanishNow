# Puerta única de SpanishNow detrás del Caddy compartido (DEP-01, DEP-02): sirve el frontend y envía al backend
# /api, /health y /uploads. Así el Caddy compartido solo necesita un `reverse_proxy` y todo se puede probar por un puerto.

# Esquema original de la petición: el Caddy lo informa; sin Caddy (prueba local o túnel) vale el de esta conexión.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # El backend admite subidas de hasta 50 MB (upload.middleware.js).
  client_max_body_size 60m;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Docker resuelve el nombre en cada petición: si el backend se reinicia o cambia de IP, nginx no se entera tarde.
  resolver 127.0.0.11 valid=10s;

  location ~ ^/(api/|health$|uploads/) {
    set $api http://spanishnow-api:3000;
    proxy_pass $api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Cadena de IPs para TRUST_PROXY=2 (Caddy + este nginx): no se toca el X-Forwarded-For que llega, se le suma.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
  }

  # Lo que decide qué versión corre el navegador no se cachea: así una publicación llega al próximo ingreso.
  location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|manifest\.webmanifest)$ {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Archivos con hash en el nombre (chunk-ABC123.js, styles-XYZ.css): no cambian nunca, cache de un año.
  location ~ "^/[^/]+-[A-Za-z0-9]{8}\.(js|css)$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # El resto de los archivos estáticos (imágenes, fuentes, assets) no tienen hash: una hora.
  location ~* \.(png|jpg|jpeg|webp|svg|ico|woff2?|mp3|ogg|json|txt)$ {
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Aplicación de una sola página: cualquier ruta del navegador entrega index.html.
  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
