<div class="auth-page">
  <div class="auth-card">
    <header class="auth-card__head">
      <img src="logo-mark.svg" alt="" width="48" height="45">
      <h1 class="auth-card__title">{{ 'auth.forgotPassword' | t }}</h1>
      <p class="auth-card__subtitle">{{ 'auth.forgotSubtitle' | t }}</p>
    </header>

    @if (sent()) {
      <div class="alert alert-success" role="status">
        {{ 'auth.resetSent' | t }}
      </div>
      <p class="auth-card__alt"><a routerLink="/auth/login">{{ 'auth.backToSignIn' | t }}</a></p>
    } @else {
      @if (errorMessage()) {
        <div class="alert alert-danger" role="alert">{{ errorMessage() }}</div>
      }
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="mb-4">
          <label for="email" class="form-label">{{ 'common.email' | t }}</label>
          <input type="email" class="form-control" id="email" formControlName="email" autocomplete="email"
                 [class.is-invalid]="invalid()" [placeholder]="'common.emailPlaceholder' | t">
          @if (invalid()) {
            <div class="invalid-feedback">{{ 'auth.emailInvalid' | t }}</div>
          }
        </div>
        <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
          }
          {{ 'auth.sendReset' | t }}
        </button>
        <p class="auth-card__alt"><a routerLink="/auth/login">{{ 'auth.backToSignIn' | t }}</a></p>
      </form>
    }
  </div>
</div>
