<div class="auth-page">
  <div class="auth-card">
    <header class="auth-card__head">
      <img src="logo-mark.svg" alt="" width="48" height="45">
      <h1 class="auth-card__title">SpanishNow</h1>
      <p class="auth-card__subtitle">Crea tu cuenta</p>
    </header>

    @if (errorMessage) {
      <div class="alert alert-danger" role="alert">{{ errorMessage }}</div>
    }

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="mb-3">
        <label for="name" class="form-label">Nombre completo</label>
        <input type="text" class="form-control" id="name" formControlName="name"
               [class.is-invalid]="hasError('name')" placeholder="Juan Pérez" autocomplete="name">
        @if (hasError('name')) {
          <div class="invalid-feedback">{{ getErrorMessage('name') }}</div>
        }
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" formControlName="email"
               [class.is-invalid]="hasError('email')" placeholder="tu@email.com" autocomplete="email">
        @if (hasError('email')) {
          <div class="invalid-feedback">{{ getErrorMessage('email') }}</div>
        }
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <input type="password" class="form-control" id="password" formControlName="password"
               [class.is-invalid]="hasError('password')" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
        @if (hasError('password')) {
          <div class="invalid-feedback">{{ getErrorMessage('password') }}</div>
        }
      </div>

      <fieldset class="mb-4 role-picker">
        <legend class="form-label">Soy…</legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="role" id="roleStudent" value="student" formControlName="role">
          <label class="form-check-label" for="roleStudent">
            <strong>Estudiante</strong>
            <small class="d-block text-muted">Quiero aprender español</small>
          </label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="role" id="roleTeacher" value="teacher" formControlName="role">
          <label class="form-check-label" for="roleTeacher">
            <strong>Profesor</strong>
            <small class="d-block text-muted">Quiero crear y enseñar cursos</small>
          </label>
        </div>
      </fieldset>

      <button type="submit" class="btn btn-primary btn-lg w-100" [disabled]="registerForm.invalid || isLoading">
        @if (isLoading) {
          <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
        }
        {{ isLoading ? 'Creando cuenta…' : 'Crear cuenta' }}
      </button>

      <p class="auth-card__alt">
        ¿Ya tienes cuenta?
        <a routerLink="/auth/login">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
