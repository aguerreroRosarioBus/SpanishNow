<div class="info-page">
  <div class="page-header">
    <div class="page-header__main">
      <h1 class="page-title">{{ 'nav.contact' | t }}</h1>
      <p class="page-summary">{{ 'info.contactSummary' | t }}</p>
    </div>
  </div>

  <div class="contact-grid">
    <section class="info-section">
      <span class="icon-tile" aria-hidden="true"><app-icon name="mail" [size]="18" /></span>
      <h2>{{ 'common.email' | t }}</h2>
      <a href="mailto:contacto@spanishnow.com">contacto@spanishnow.com</a>
    </section>

    <section class="info-section">
      <span class="icon-tile" aria-hidden="true"><app-icon name="headphones" [size]="18" /></span>
      <h2>{{ 'info.support' | t }}</h2>
      <a href="mailto:soporte@spanishnow.com">soporte@spanishnow.com</a>
    </section>
  </div>

  <section class="info-section">
    <h2>{{ 'info.messageTitle' | t }}</h2>
    <p class="mb-0">
      {{ 'info.message' | t }}
    </p>
  </section>
</div>
