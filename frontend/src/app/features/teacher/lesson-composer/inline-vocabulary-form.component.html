<form class="inline-form" (ngSubmit)="submit()" [attr.aria-label]="'teacherComposer.vForm.aria' | t">
  <div class="inline-row">
    <label [attr.for]="uid() + '-word'">{{ 'teacherComposer.vForm.word' | t }}<input [id]="uid() + '-word'" name="word" maxlength="120" [ngModel]="word()" (ngModelChange)="word.set($event)"></label>
    <label [attr.for]="uid() + '-tr'">{{ 'teacherComposer.vForm.translation' | t }}<input [id]="uid() + '-tr'" name="translation" maxlength="200" [ngModel]="translation()" (ngModelChange)="translation.set($event)" [disabled]="!!match()" [placeholder]="match()?.translation || ''"></label>
  </div>
  <div class="inline-image" *ngIf="!match()">
    <span class="inline-image-label">{{ 'teacherComposer.vForm.imageOptional' | t }}</span>
    <input #file type="file" class="inline-hidden" tabindex="-1" aria-hidden="true" [accept]="accept" (change)="onImageFile($event)">
    <img *ngIf="imagePreview() as src" class="inline-thumb" [src]="src" [alt]="'teacherComposer.vForm.previewAlt' | t" width="64" height="48">
    <button type="button" class="small-button inline-icon-btn" [disabled]="busy()" (click)="draw()"><app-icon name="palette" /> {{ 'teacherComposer.vForm.draw' | t }}</button>
    <button type="button" class="small-button inline-icon-btn" [disabled]="busy()" (click)="file.click()"><app-icon name="upload" /> {{ (image() ? 'teacherComposer.vForm.changeImage' : 'teacherComposer.vForm.uploadImage') | t }}</button>
    <button type="button" *ngIf="image()" class="text-button" [disabled]="busy()" (click)="removeImage()">{{ 'teacherComposer.vForm.removeImage' | t }}</button>
  </div>
  <app-image-search *ngIf="!match()" [initialQuery]="word()" [disabled]="busy()" (imageSelected)="setImage($event)" />
  <p class="inline-help" *ngIf="match()" role="status">{{ 'teacherComposer.vForm.exists' | t:{ word: match()!.word, translation: match()!.translation } }}</p>
  <p class="inline-error" role="alert" *ngIf="error()">{{ error() }}</p>
  <div class="inline-actions">
    <button type="submit" class="small-button" [disabled]="busy() || (!match() && (!word().trim() || !translation().trim()))">{{ (busy() ? 'teacherComposer.vForm.saving' : match() ? 'teacherComposer.vForm.use' : 'teacherComposer.vForm.save') | t }}</button>
    <button type="button" class="text-button" (click)="cancelled.emit()">{{ 'teacherComposer.vForm.cancel' | t }}</button>
  </div>
</form>
