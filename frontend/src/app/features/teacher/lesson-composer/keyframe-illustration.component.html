<section class="ill" [attr.aria-labelledby]="'ill-title-' + block().blockKey">
  <h4 class="ill-title" [id]="'ill-title-' + block().blockKey">{{ 'teacherComposer.ill.title' | t }}</h4>
  <input #file type="file" class="visually-hidden" tabindex="-1" aria-hidden="true" [accept]="accept" (change)="onFile($event)">

  <div class="ill-body">
    <ng-container *ngIf="block().imageUrl as url; else empty">
      <button type="button" class="ill-thumb" [attr.aria-label]="'teacherComposer.ill.enlargeAria' | t" [title]="'teacherComposer.ill.enlarge' | t" (click)="openLarge()">
        <img [src]="url" [alt]="block().imageAlt || ('teacherComposer.ill.defaultAlt' | t)" loading="lazy" width="160" height="120">
        <span class="ill-zoom"><app-icon name="zoom" /></span>
      </button>
      <div class="ill-side">
        <div class="ill-actions">
          <button type="button" class="ill-btn" [disabled]="locked()" (click)="draw(true)"><app-icon name="pencil" /> {{ 'teacherComposer.ill.editDrawing' | t }}</button>
          <button type="button" class="ill-btn" [disabled]="locked()" (click)="file.click()"><app-icon name="upload" /> {{ 'teacherComposer.ill.uploadImage' | t }}</button>
          <button *ngIf="!confirmRemove()" type="button" class="ill-btn ill-danger" [disabled]="locked()" (click)="confirmRemove.set(true)"><app-icon name="trash" /> {{ 'teacherComposer.ill.remove' | t }}</button>
        </div>
        <div *ngIf="confirmRemove()" class="ill-confirm" role="alertdialog" [attr.aria-label]="'teacherComposer.ill.confirmAria' | t">
          <span>{{ 'teacherComposer.ill.confirmText' | t }}</span>
          <button type="button" class="text-button" (click)="confirmRemove.set(false)">{{ 'teacherComposer.ill.keep' | t }}</button>
          <button type="button" class="text-button ill-danger" [disabled]="locked()" (click)="remove()">{{ 'teacherComposer.ill.remove' | t }}</button>
        </div>
      </div>
    </ng-container>
    <ng-template #empty>
      <div class="ill-empty">
        <p class="ill-help">{{ 'teacherComposer.ill.emptyHelp' | t }}</p>
        <div class="ill-actions">
          <button type="button" class="ill-btn ill-primary" [disabled]="locked()" (click)="draw(false)"><app-icon name="palette" /> {{ 'teacherComposer.ill.draw' | t }}</button>
          <button type="button" class="ill-btn" [disabled]="locked()" (click)="file.click()"><app-icon name="upload" /> {{ 'teacherComposer.ill.uploadImage' | t }}</button>
        </div>
      </div>
    </ng-template>
  </div>

  <app-image-search [initialQuery]="suggestion()" [disabled]="locked()" (imageSelected)="upload($event)" />

  <ng-container *ngIf="block().imageUrl">
    <label class="ill-alt" [attr.for]="'ill-alt-' + block().blockKey">{{ 'teacherComposer.ill.altLabel' | t }}</label>
    <input [id]="'ill-alt-' + block().blockKey" type="text" maxlength="300" [disabled]="disabled()" [ngModel]="block().imageAlt || ''" (ngModelChange)="onAlt($event)" [ngModelOptions]="{standalone: true}"
      [placeholder]="suggestion() || ('teacherComposer.ill.altPlaceholder' | t)">
    <p class="ill-help">{{ 'teacherComposer.ill.screenReaders' | t }}
      <button *ngIf="!(block().imageAlt || '').trim() && suggestion()" type="button" class="text-button" (click)="useSuggestion()">{{ 'teacherComposer.ill.useSuggestion' | t }}</button>
    </p>
  </ng-container>

  <p *ngIf="busy()" class="ill-status" role="status">{{ 'teacherComposer.ill.processing' | t }}</p>
  <p *ngIf="dirty() && !block().imageUrl" class="ill-help">{{ 'teacherComposer.ill.dirtyHint' | t }}</p>
  <p *ngIf="error()" class="ill-error" role="alert">{{ error() }}</p>

  <div *ngIf="enlarged()" class="ill-lightbox" role="dialog" aria-modal="true" [attr.aria-label]="'teacherComposer.ill.lightboxAria' | t" (click)="closeLarge()" (keydown)="onLightboxKeydown($event)">
    <button type="button" class="ill-lightbox-close" [attr.aria-label]="'teacherComposer.ill.close' | t" (click)="closeLarge()"><app-icon name="close" /></button>
    <img [src]="block().imageUrl" [alt]="block().imageAlt || ('teacherComposer.ill.defaultAlt' | t)" (click)="$event.stopPropagation()">
  </div>
</section>
