<div class="container-fluid mt-4">
  <div class="row">
    <div class="col-12">
      <!-- Loading -->
      <div *ngIf="store.isLoading()" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Cargando...</span>
        </div>
        <p class="text-muted mt-2">Cargando curso...</p>
      </div>

      <!-- Error -->
      <div *ngIf="store.errorMessage()" class="alert alert-danger">
        {{ store.errorMessage() }}
      </div>

      <!-- Course Content -->
      <div *ngIf="!store.isLoading() && store.course()">
        <div class="d-flex justify-content-between align-items-center mb-4">
          <div>
            <button class="btn btn-outline-secondary btn-sm mb-2" (click)="goBack()">
              ← Volver al Dashboard
            </button>
            <div class="d-flex align-items-center gap-2">
              <h1 class="h3 mb-1">{{ store.course()?.title }}</h1>
              <button class="btn btn-sm btn-outline-primary" (click)="store.open({ kind: 'course-edit' })" title="Editar curso">
                ✏️
              </button>
            </div>
            <p class="text-muted mb-0">Gestión de Contenido del Curso</p>
          </div>
          <button class="btn btn-success" (click)="store.open({ kind: 'unit-create' })">
            + Nueva Unidad
          </button>
        </div>

        <app-unit-list />
      </div>
    </div>
  </div>
</div>

<!-- Diálogos: se crean al abrirse y se destruyen al cerrarse -->
<ng-container *ngIf="store.modal() as modal">
  <ng-container [ngSwitch]="modal.kind">
    <app-course-edit-modal *ngSwitchCase="'course-edit'" />
    <app-unit-form-modal *ngSwitchCase="'unit-create'" />
    <ng-container *ngSwitchCase="'unit-edit'">
      <app-unit-form-modal [unit]="$any(modal).unit" />
    </ng-container>
    <ng-container *ngSwitchCase="'story-create'">
      <app-story-create-modal [unitId]="$any(modal).unitId" />
    </ng-container>
    <ng-container *ngSwitchCase="'story-edit'">
      <app-story-edit-modal [story]="$any(modal).story" />
    </ng-container>
    <ng-container *ngSwitchCase="'questions'">
      <app-question-modal [story]="$any(modal).story" />
    </ng-container>
    <ng-container *ngSwitchCase="'vocabulary'">
      <app-vocabulary-modal [unit]="$any(modal).unit" />
    </ng-container>
    <ng-container *ngSwitchCase="'repetitions'">
      <app-repetition-modal [story]="$any(modal).story" />
    </ng-container>
    <ng-container *ngSwitchCase="'story-tooltips'">
      <app-tooltip-modal [title]="$any(modal).story.title" targetType="story"
        [targetId]="$any(modal).story.id" [text]="$any(modal).story.text" (closed)="store.close()" />
    </ng-container>
  </ng-container>
</ng-container>

<!-- Modal Backdrop -->
<div class="modal-backdrop fade show" *ngIf="store.hasBackdrop()"></div>

<!-- Confirm Dialog -->
<app-confirm-dialog
  *ngIf="store.confirmData() as confirm"
  [show]="store.showConfirmDialog()"
  [title]="confirm.title"
  [message]="confirm.message"
  [confirmText]="confirm.confirmText"
  [type]="confirm.type"
  (confirmed)="store.acceptConfirm()"
  (cancelled)="store.cancelConfirm()"
></app-confirm-dialog>

<ng-container *ngIf="store.modal() as modal">
  <app-lesson-composer
    *ngIf="modal.kind === 'composer'"
    [story]="$any(modal).story"
    [unit]="$any(modal).unit"
    [courseUnits]="store.units()"
    (closed)="store.close()"
    (manageQuestions)="manageQuestionsFromComposer()"
    (manageVocabulary)="manageVocabularyFromComposer()"
  ></app-lesson-composer>
</ng-container>
