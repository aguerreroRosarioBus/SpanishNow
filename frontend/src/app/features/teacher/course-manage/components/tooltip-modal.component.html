<div class="modal fade show" style="display: block" tabindex="-1">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Tooltips · {{ title() }}</h5>
        <button type="button" class="btn-close" (click)="closed.emit()"></button>
      </div>
      <div class="modal-body">
        <app-tooltip-editor [targetType]="targetType()" [targetId]="targetId()" [text]="text()" />
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closed.emit()">Cerrar</button>
      </div>
    </div>
  </div>
</div>
