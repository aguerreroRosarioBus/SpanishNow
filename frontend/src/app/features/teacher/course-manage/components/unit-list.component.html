<div class="list-bar">
  <h2 class="list-bar__title">{{ 'teacherDashboard.units.title' | t }}</h2>
  @if (store.units().length > 0) {
    <div class="list-bar__actions">
      <button type="button" class="btn btn-ghost btn-sm" (click)="store.expandAllUnits()">{{ 'teacherDashboard.units.expandAll' | t }}</button>
      <button type="button" class="btn btn-ghost btn-sm" (click)="store.collapseAllUnits()">{{ 'teacherDashboard.units.collapseAll' | t }}</button>
    </div>
  }
</div>

@if (store.units().length === 0) {
  <div class="state-box">
    <strong>{{ 'teacherDashboard.units.emptyTitle' | t }}</strong>
    <span>{{ 'teacherDashboard.units.emptyHint' | t }}</span>
  </div>
}

<div class="unit-stack">
  @for (unit of store.units(); track unit.id) {
    <app-unit-card [unit]="unit" [number]="$index + 1" />
  }
</div>
