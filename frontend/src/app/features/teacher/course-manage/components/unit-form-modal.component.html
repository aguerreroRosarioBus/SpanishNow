<div class="modal fade show" style="display: block" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ unit() ? 'Editar Unidad' : 'Nueva Unidad' }}</h5>
        <button type="button" class="btn-close" (click)="close()"></button>
      </div>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="modal-body">
          <div class="mb-3">
            <label for="unitTitle" class="form-label">Título *</label>
            <input type="text" class="form-control" id="unitTitle" formControlName="title"
              [placeholder]="unit() ? 'Ej: Unidad 1: Saludos' : 'Ej: Saludos y Presentaciones'">
            <div *ngIf="!unit() && form.get('title')?.invalid && form.get('title')?.touched" class="text-danger small mt-1">
              El título debe tener al menos 3 caracteres
            </div>
          </div>

          <div class="mb-3">
            <label for="unitDescription" class="form-label">Descripción *</label>
            <textarea class="form-control" id="unitDescription" rows="3" formControlName="description"
              [placeholder]="unit() ? 'Descripción de la unidad' : 'Describe el contenido de esta unidad'"></textarea>
            <div *ngIf="!unit() && form.get('description')?.invalid && form.get('description')?.touched" class="text-danger small mt-1">
              La descripción debe tener al menos 10 caracteres
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="close()">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">
            {{ unit() ? 'Guardar Cambios' : 'Crear Unidad' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
