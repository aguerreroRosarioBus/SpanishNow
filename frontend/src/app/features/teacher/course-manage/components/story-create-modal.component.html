<div class="modal fade show" style="display: block" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">{{ 'teacherManage.storyCreate.title' | t }}</h5>
        <button type="button" class="btn-close" (click)="close()" [attr.aria-label]="'teacherManage.common.close' | t"></button>
      </div>
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="modal-body">
          <div class="mb-3">
            <label for="storyTitle" class="form-label">{{ 'teacherManage.common.titleRequired' | t }}</label>
            <input type="text" class="form-control" id="storyTitle" formControlName="title" [attr.placeholder]="'teacherManage.storyCreate.titlePlaceholder' | t">
            <div *ngIf="form.get('title')?.invalid && form.get('title')?.touched" class="text-danger small mt-1">
              {{ 'teacherManage.common.titleMin3' | t }}
            </div>
          </div>

          <p class="text-muted small mb-3">
            {{ 'teacherManage.storyCreate.hint' | t }}
          </p>

          <div class="mb-3">
            <label class="form-label">{{ 'teacherManage.storyCreate.audioSlow' | t }}</label>
            <app-audio-input #slow name="audioSlow" [validate]="true" recordedFileName="audio-slow.webm"
              uploadHint="teacherManage.audio.hintFormats"
              recordingText="teacherManage.audio.recordingSlow"
              recordedText="teacherManage.audio.recordedSlow"
              startedMessage="teacherManage.audio.startedSlow" stoppedMessage="teacherManage.audio.stoppedSlow" />
          </div>

          <div class="mb-3">
            <label class="form-label">{{ 'teacherManage.storyCreate.audioNormal' | t }}</label>
            <app-audio-input #normal name="audioNormal" [validate]="true" recordedFileName="audio-normal.webm"
              uploadHint="teacherManage.audio.hintFormats"
              recordingText="teacherManage.audio.recordingNormal"
              recordedText="teacherManage.audio.recordedNormal"
              startedMessage="teacherManage.audio.startedNormal" stoppedMessage="teacherManage.audio.stoppedNormal" />
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" (click)="close()">{{ 'teacherManage.common.cancel' | t }}</button>
          <button type="submit" class="btn btn-primary" [disabled]="form.invalid">{{ 'teacherManage.storyCreate.submit' | t }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
