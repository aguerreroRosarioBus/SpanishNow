<div class="player">
  <div class="player__index" [class.is-expanded]="indexOpen()">
    <button type="button" class="btn btn-secondary player__index-toggle" [attr.aria-expanded]="indexOpen()" aria-controls="playerIndex" (click)="indexOpen.set(!indexOpen())">{{'refine.courseIndex'|t}} <span aria-hidden="true">{{indexOpen()?'−':'+'}}</span></button>
    <app-player-sidebar id="playerIndex" />
  </div>

  <div class="player__main">
    @if (nav.errorMessage()) {
      <div class="alert alert-danger" role="alert">{{ nav.errorMessage() }}</div>
    }

    @if (!nav.isLoading() && nav.currentUnitLocked() && !nav.currentItem()) {
      <app-unit-locked-view />
    } @else if (!nav.isLoading() && nav.currentItem(); as item) {
      @switch (item.kind) {
        @case ('intro') { <app-intro-view /> }
        @case ('quiz') { <app-quiz-view /> }
        @default { <app-lesson-view /> }
      }
    }
  </div>
</div>
