<div class="container-fluid mt-4">
  <div class="row player-row">
    <!-- Panel del curso -->
    <div class="col-md-3">
      <app-player-sidebar (back)="goBack()" />
    </div>

    <!-- Contenido principal -->
    <div class="col-md-9">
      <div *ngIf="nav.errorMessage()" class="alert alert-danger">
        {{ nav.errorMessage() }}
      </div>

      <div *ngIf="!nav.isLoading() && nav.currentItem() as item">
        <!-- Flechas: misma regla de acceso que el menú lateral -->
        <div class="d-flex justify-content-between align-items-center mb-3 gap-2">
          <button
            class="btn btn-sm btn-outline-primary px-2 py-1 flex-shrink-0"
            [disabled]="!nav.canGoPrevious()"
            [title]="nav.canGoPrevious() ? 'Historia anterior' : 'No hay una historia anterior disponible'"
            aria-label="Historia anterior"
            (click)="nav.goToPrevious()"
            style="font-size: 0.875rem;"
          >
            ←<span class="d-none d-lg-inline ms-1">Anterior</span>
          </button>

          <h4 class="mb-0 text-center flex-grow-1" style="font-size: 1.1rem; min-width: 0;">
            {{ item.title }}
          </h4>

          <button
            class="btn btn-sm btn-outline-primary px-2 py-1 flex-shrink-0"
            [disabled]="!nav.canGoNext()"
            [title]="nav.nextBlockedReason() || (nav.canGoNext() ? 'Historia siguiente' : 'No hay una historia siguiente')"
            [attr.aria-label]="nav.nextBlockedReason() ? 'Historia siguiente bloqueada. ' + nav.nextBlockedReason() : 'Historia siguiente'"
            (click)="nav.goToNext()"
            style="font-size: 0.875rem;"
          >
            <span class="d-none d-lg-inline me-1">Siguiente</span>→
          </button>
        </div>
        <p *ngIf="nav.nextBlockedReason()" class="small text-muted text-end mb-3" role="status">🔒 {{ nav.nextBlockedReason() }}</p>

        <app-lesson-view />
      </div>
    </div>
  </div>
</div>
