<div class="auth-page">
  <div class="auth-card success-card">
    <header class="auth-card__head">
      <h1 class="auth-card__title">{{ 'checkout.received' | t }}</h1>
      <p class="auth-card__subtitle">{{ 'checkout.accessEmail' | t }}</p>
    </header>
    <p class="auth-card__alt">{{ 'auth.haveAccount' | t }} <a routerLink="/auth/login">{{ 'auth.signIn' | t }}</a></p>
  </div>
</div>
