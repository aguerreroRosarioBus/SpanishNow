<aside class="sidebar-nav" [class.collapsed]="collapsed()">
  <nav class="sidebar-menu" aria-label="Navegación principal">
    @for (group of groups(); track group.title; let first = $first) {
      @if (!first) {
        <div class="sidebar-divider"></div>
      }
      @if (!collapsed()) {
        <div class="sidebar-header">{{ group.title }}</div>
      }
      @for (item of group.items; track item.label) {
        <a class="sidebar-item"
           [routerLink]="item.link"
           [queryParams]="item.query ?? null"
           routerLinkActive
           #rla="routerLinkActive"
           [class.active]="rla.isActive || isUnder(item)"
           [routerLinkActiveOptions]="item.exactQuery ? { paths: 'exact', queryParams: 'exact', fragment: 'ignored', matrixParams: 'ignored' } : { paths: 'subset', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }"
           [attr.aria-label]="collapsed() ? item.label : null"
           [attr.title]="collapsed() ? item.label : null">
          <app-icon [name]="item.icon" [size]="collapsed() ? 20 : 18" />
          @if (!collapsed()) {
            <span class="sidebar-label">{{ item.label }}</span>
          }
        </a>
      }
    }
  </nav>

  @if (!forced()) {
    <button class="sidebar-item sidebar-collapse" type="button" (click)="collapseToggle.emit()"
            [attr.aria-label]="collapsed() ? 'Expandir menú' : 'Plegar menú'"
            [attr.title]="collapsed() ? 'Expandir menú' : null">
      <app-icon name="panel-left" [size]="collapsed() ? 20 : 18" />
      @if (!collapsed()) {
        <span class="sidebar-label">Plegar menú</span>
      }
    </button>
  }
</aside>
