<div class="modal-backdrop" (click)="onCancel()"></div>

<div class="modal-dialog" (click)="$event.stopPropagation()">
  <div class="modal-content">
    <!-- Header -->
    <div class="modal-header">
      <h5 class="modal-title">Cambiar Contraseña</h5>
      <button type="button" class="btn-close" (click)="onCancel()" aria-label="Cerrar"></button>
    </div>

    <!-- Body -->
    <div class="modal-body">
      <form [formGroup]="changePasswordForm" (ngSubmit)="onSubmit()">
        <!-- Current Password -->
        <div class="mb-3">
          <label for="currentPassword" class="form-label">Contraseña Actual</label>
          <div class="input-group">
            <input
              [type]="showCurrentPassword() ? 'text' : 'password'"
              class="form-control"
              id="currentPassword"
              formControlName="currentPassword"
              [class.is-invalid]="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched">
            <button
              class="btn btn-outline-secondary password-toggle-btn"
              type="button"
              (click)="toggleShowPassword('current')">
              {{ showCurrentPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          <div class="invalid-feedback d-block" *ngIf="changePasswordForm.get('currentPassword')?.invalid && changePasswordForm.get('currentPassword')?.touched">
            La contraseña actual es requerida
          </div>
        </div>

        <!-- New Password -->
        <div class="mb-3">
          <label for="newPassword" class="form-label">Nueva Contraseña</label>
          <div class="input-group">
            <input
              [type]="showNewPassword() ? 'text' : 'password'"
              class="form-control"
              id="newPassword"
              formControlName="newPassword"
              [class.is-invalid]="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
            <button
              class="btn btn-outline-secondary password-toggle-btn"
              type="button"
              (click)="toggleShowPassword('new')">
              {{ showNewPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          <div class="invalid-feedback d-block" *ngIf="changePasswordForm.get('newPassword')?.invalid && changePasswordForm.get('newPassword')?.touched">
            <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['required']">
              La nueva contraseña es requerida
            </span>
            <span *ngIf="changePasswordForm.get('newPassword')?.errors?.['minlength']">
              La contraseña debe tener al menos 6 caracteres
            </span>
          </div>
        </div>

        <!-- Confirm Password -->
        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirmar Nueva Contraseña</label>
          <div class="input-group">
            <input
              [type]="showConfirmPassword() ? 'text' : 'password'"
              class="form-control"
              id="confirmPassword"
              formControlName="confirmPassword"
              [class.is-invalid]="(changePasswordForm.errors?.['passwordMismatch'] || changePasswordForm.get('confirmPassword')?.invalid) && changePasswordForm.get('confirmPassword')?.touched">
            <button
              class="btn btn-outline-secondary password-toggle-btn"
              type="button"
              (click)="toggleShowPassword('confirm')">
              {{ showConfirmPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          <div class="invalid-feedback d-block" *ngIf="changePasswordForm.get('confirmPassword')?.touched">
            <span *ngIf="changePasswordForm.get('confirmPassword')?.errors?.['required']">
              Debe confirmar la nueva contraseña
            </span>
            <span *ngIf="changePasswordForm.errors?.['passwordMismatch'] && !changePasswordForm.get('confirmPassword')?.errors?.['required']">
              Las contraseñas no coinciden
            </span>
          </div>
        </div>

        <!-- Info Alert -->
        <div class="alert alert-info mb-0">
          <small><strong>ℹ️</strong> La contraseña debe tener al menos 6 caracteres y ser diferente a la actual.</small>
        </div>
      </form>
    </div>

    <!-- Footer -->
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="isSubmitting()">
        Cancelar
      </button>
      <button
        type="button"
        class="btn btn-primary"
        (click)="onSubmit()"
        [disabled]="changePasswordForm.invalid || isSubmitting()">
        <span *ngIf="isSubmitting()" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        {{ isSubmitting() ? 'Cambiando...' : 'Cambiar Contraseña' }}
      </button>
    </div>
  </div>
</div>
