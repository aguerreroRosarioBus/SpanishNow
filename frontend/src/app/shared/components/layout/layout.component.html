<div class="app-layout">
  <app-navbar-top
    [showUser]="!isAuthPage()"
    [menuOpen]="sidebarOpen()"
    (sidebarToggle)="toggleSidebar()"></app-navbar-top>

  @if (impersonating() && currentUser(); as user) {
    <div class="impersonation-banner" role="status">
      <span>{{ 'nav.impersonating' | t : { name: user.name } }}</span>
      <button type="button" class="btn btn-sm btn-light" (click)="stopImpersonating()">{{ 'nav.returnToAccount' | t }}</button>
    </div>
  }

  <div class="layout-content">
    @if (showSidebar()) {
      <app-sidebar-nav
        [collapsed]="sidebarCollapsed()"
        [class.open]="sidebarOpen()"
        [forced]="isWorkspace()"
        (collapseToggle)="toggleCollapse()"></app-sidebar-nav>
    }

    <main class="main-content" id="contenido" [class.is-board]="isLiveRoom()">
      <div class="content-wrapper" [class.is-wide]="isWorkspace()" [class.is-board]="isLiveRoom()" [class.is-bare]="isAuthPage()">
        <router-outlet></router-outlet>
      </div>

      @if (showFooter()) {
        <footer class="app-footer">
          <div class="footer-inner">
            <a class="footer-brand" routerLink="/">
              <img src="logo-mark.svg" alt="" width="24" height="23">
              <span>SpanishNow</span>
            </a>
            <nav class="footer-links" [attr.aria-label]="'nav.siteLinks' | t">
              <a routerLink="/about">{{ 'nav.about' | t }}</a>
              <a routerLink="/contact">{{ 'nav.contact' | t }}</a>
            </nav>
            <small class="footer-copy">© {{ year }} SpanishNow</small>
          </div>
        </footer>
      }
    </main>
  </div>

  @if (showSidebar() && sidebarOpen()) {
    <div class="sidebar-overlay" (click)="toggleSidebar()"></div>
  }
</div>
